<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>$PRUNK1.M$1</title>
</head>
<body>
  <script>
    async function loadAndRun() {
      const urls = [
        "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/stuff-that-skibidi@main/sprunk-msi/SPRUNKI.MSI%20(New%20Update).html.part1",
        "https://cdn.jsdelivr.net/gh/iamthegamesofsprunk/stuff-that-skibidi@main/sprunk-msi/SPRUNKI.MSI%20(New%20Update).html.part2"
      ];
      let fullHtml = "";
      for (const u of urls) {
        const res = await fetch(u);
        fullHtml += await res.text();
      }

      document.open();
      document.write(fullHtml);
      document.close();
    }

    loadAndRun();
  </script>
</body>
